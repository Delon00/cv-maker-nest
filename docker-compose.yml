version: '3.8'

services:
  # --- SERVICE BASE DE DONNÉES (POSTGRES + VECTOR) ---
  db:
    image: pgvector/pgvector:0.8.1-pg17-trixie
    container_name: cv_db_vector
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432" # Accessible depuis ton PC sur localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data



volumes:
  postgres_data: